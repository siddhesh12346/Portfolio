apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: siddheshk1234/portfolio:latest
        imagePullPolicy: Always  # <--- Change this to Always!
        ports:
        - containerPort: 3000
